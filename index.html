<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Grand — Concept Review</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0B0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bar-h: 54px;
    --ink: #0B0B0C;
    --ink-2: #141416;
    --line: rgba(255,255,255,.12);
    --line-soft: rgba(255,255,255,.07);
    --fg: #F4F1EC;
    --fg-dim: rgba(244,241,236,.46);
    --accent: #F4F1EC;
    --ease: cubic-bezier(.22,1,.36,1);
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (max-width: 720px){ :root{ --bar-h: 50px; } }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:var(--ink); }
  body{
    display:flex; flex-direction:column;
    height:100dvh; overflow:hidden;
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
    color:var(--fg);
  }

  /* ── Chrome bar ───────────────────────────────────────── */
  .bar{
    flex:0 0 var(--bar-h);
    height:var(--bar-h);
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:16px;
    padding:0 16px;
    background:linear-gradient(180deg,var(--ink-2),var(--ink));
    border-bottom:1px solid var(--line-soft);
    position:relative; z-index:10;
    user-select:none;
  }
  .bar::after{ /* hairline sheen */
    content:""; position:absolute; left:0; right:0; top:0; height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);
  }

  .mark{
    display:flex; align-items:center; gap:10px;
    font-size:10px; letter-spacing:.18em; text-transform:uppercase;
    white-space:nowrap; overflow:hidden;
  }
  .mark b{ font-weight:500; color:var(--fg); }
  .mark span{ color:var(--fg-dim); }
  .mark i{
    display:block; width:1px; height:12px; background:var(--line);
    flex:0 0 1px; font-style:normal;
  }

  /* ── Segmented toggle ─────────────────────────────────── */
  .seg{
    position:relative;
    display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
    align-items:stretch;
    background:rgba(255,255,255,.045);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    min-width:280px;
  }
  .seg::before{
    content:"";
    position:absolute; top:3px; left:3px; bottom:3px;
    width:calc(50% - 3px);
    border-radius:999px;
    background:var(--accent);
    transform:translate3d(var(--x,0),0,0);
    transition:transform .5s var(--ease);
    box-shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
  }
  .seg[data-active="1"]{ --x:100%; }

  .seg button{
    position:relative; z-index:1;
    appearance:none; -webkit-appearance:none;
    background:none; border:0; margin:0;
    padding:0 18px; height:32px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font:inherit; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--fg-dim); cursor:pointer; white-space:nowrap;
    border-radius:999px;
    transition:color .35s var(--ease);
  }
  .seg button:hover{ color:rgba(244,241,236,.8); }
  .seg button[aria-selected="true"]{ color:var(--ink); font-weight:500; }
  .seg button:focus-visible{ outline:1px solid var(--fg); outline-offset:3px; }
  .seg button em{
    font-style:normal; font-size:9px; opacity:.55;
    font-variant-numeric:tabular-nums;
  }
  .seg button[aria-selected="true"] em{ opacity:.5; }

  /* ── Right utilities ──────────────────────────────────── */
  .utils{
    display:flex; align-items:center; justify-content:flex-end; gap:14px;
    font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  }
  .keys{ color:var(--fg-dim); white-space:nowrap; }
  .keys kbd{
    font:inherit; font-size:9px;
    border:1px solid var(--line); border-radius:4px;
    padding:2px 5px; margin:0 1px; color:var(--fg-dim);
  }
  .pop{
    display:inline-flex; align-items:center; gap:7px;
    color:var(--fg-dim); text-decoration:none; white-space:nowrap;
    padding:7px 12px; border:1px solid var(--line); border-radius:999px;
    transition:color .3s var(--ease), border-color .3s var(--ease), background .3s var(--ease);
  }
  .pop:hover{ color:var(--fg); border-color:rgba(255,255,255,.28); background:rgba(255,255,255,.05); }
  .pop:focus-visible{ outline:1px solid var(--fg); outline-offset:3px; }

  /* ── Stage ────────────────────────────────────────────── */
  .stage{
    flex:1 1 auto; position:relative; min-height:0;
    background:var(--ink);
  }
  .frame{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0; display:block;
    background:#fff;
    opacity:0; visibility:hidden;
    transition:opacity .38s var(--ease);
  }
  .frame.is-active{ opacity:1; visibility:visible; }

  /* loading sweep */
  .load{
    position:absolute; left:0; top:0; height:2px; width:100%;
    overflow:hidden; z-index:5; pointer-events:none;
    opacity:0; transition:opacity .3s var(--ease);
  }
  .load.on{ opacity:1; }
  .load::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,var(--fg),transparent);
    transform:translateX(-100%);
    animation:sweep 1.1s var(--ease) infinite;
  }
  @keyframes sweep{ to{ transform:translateX(100%); } }

  @media (max-width: 860px){
    .keys{ display:none; }
  }
  @media (max-width: 720px){
    .bar{ grid-template-columns:auto 1fr auto; padding:0 10px; gap:10px; }
    .mark span, .mark i{ display:none; }
    .seg{ min-width:0; width:100%; }
    .seg button{ padding:0 8px; font-size:9.5px; letter-spacing:.1em; }
    .seg button em{ display:none; }
    .pop span{ display:none; }
    .pop{ padding:8px 10px; }
  }

  @media (max-width: 460px){
    .mark{ display:none; }
    .bar{ grid-template-columns:1fr auto; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

  <header class="bar">
    <div class="mark">
      <b>The Grand</b><i></i><span>Concept Review</span>
    </div>

    <div class="seg" id="seg" role="tablist" aria-label="Design concept" data-active="0">
      <button role="tab" id="tab-0" aria-selected="true"  aria-controls="frame-0" tabindex="0">
        <em>01</em> Concept One
      </button>
      <button role="tab" id="tab-1" aria-selected="false" aria-controls="frame-1" tabindex="-1">
        <em>02</em> Concept Two
      </button>
    </div>

    <div class="utils">
      <span class="keys"><kbd>1</kbd><kbd>2</kbd> to switch</span>
      <a class="pop" id="pop" href="#" target="_blank" rel="noopener"><span>Open</span> ↗</a>
    </div>
  </header>

  <main class="stage">
    <div class="load" id="load"></div>
    <iframe class="frame is-active" id="frame-0" role="tabpanel" aria-labelledby="tab-0"
            title="Concept One" src="https://cohan-ui.github.io/Dooleys/"></iframe>
    <iframe class="frame" id="frame-1" role="tabpanel" aria-labelledby="tab-1"
            title="Concept Two" data-src="https://cohan-ui.github.io/Dooleys-2/"></iframe>
  </main>

<script>
(function(){
  var URLS  = ["https://cohan-ui.github.io/Dooleys/", "https://cohan-ui.github.io/Dooleys-2/"];
  var SLUGS = ["one","two"];

  var seg    = document.getElementById("seg");
  var tabs   = [].slice.call(seg.querySelectorAll("button"));
  var frames = [document.getElementById("frame-0"), document.getElementById("frame-1")];
  var pop    = document.getElementById("pop");
  var load   = document.getElementById("load");
  var active = -1;

  function showLoader(){
    load.classList.add("on");
    clearTimeout(showLoader._t);
    showLoader._t = setTimeout(hideLoader, 6000);
  }
  function hideLoader(){ load.classList.remove("on"); }

  frames.forEach(function(f){ f.addEventListener("load", hideLoader); });

  function select(i, push){
    i = (i === 1) ? 1 : 0;
    if (i === active) return;
    active = i;

    // Lazy-mount the second concept the first time it's requested.
    var f = frames[i];
    if (!f.getAttribute("src") && f.dataset.src){
      showLoader();
      f.setAttribute("src", f.dataset.src);
    }

    seg.dataset.active = i;
    tabs.forEach(function(t, n){
      t.setAttribute("aria-selected", n === i ? "true" : "false");
      t.tabIndex = n === i ? 0 : -1;
    });
    frames.forEach(function(fr, n){ fr.classList.toggle("is-active", n === i); });

    pop.href = URLS[i];
    pop.setAttribute("aria-label", "Open concept " + (i + 1) + " in a new tab");

    var hash = "#" + SLUGS[i];
    if (push && location.hash !== hash){
      history.replaceState(null, "", hash);
    }
    document.title = (i === 0 ? "Concept One" : "Concept Two") + " — The Grand";
  }

  tabs.forEach(function(t, i){
    t.addEventListener("click", function(){ select(i, true); });
  });

  // Roving arrow-key navigation across the segmented control.
  seg.addEventListener("keydown", function(e){
    var i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    var next = null;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (i + 1) % tabs.length;
    if (e.key === "ArrowLeft"  || e.key === "ArrowUp")   next = (i - 1 + tabs.length) % tabs.length;
    if (e.key === "Home") next = 0;
    if (e.key === "End")  next = tabs.length - 1;
    if (next === null) return;
    e.preventDefault();
    tabs[next].focus();
    select(next, true);
  });

  // 1 / 2 shortcuts — ignored while typing inside the harness itself.
  document.addEventListener("keydown", function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var el = document.activeElement;
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    if (e.key === "1") select(0, true);
    if (e.key === "2") select(1, true);
  });

  function fromHash(){
    var h = location.hash.replace("#","").toLowerCase();
    var i = SLUGS.indexOf(h);
    if (i < 0) i = (h === "1" || h === "2") ? (+h - 1) : 0;
    return i;
  }
  window.addEventListener("hashchange", function(){ select(fromHash(), false); });

  select(fromHash(), true);
})();
</script>
</body>
</html>
